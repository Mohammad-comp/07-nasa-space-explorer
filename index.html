<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NASA Space Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-proxy-url="https://science.nasa.gov/wp-json/wp/v2/apod-basic">
  <main class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA" class="logo">
      <h1>Space Explorer</h1>
    </header>

    <form id="dateForm" class="filters">
      <label>
        Start date
        <input id="startDate" type="date" required>
      </label>
      <label>
        End date
        <input id="endDate" type="date" required>
      </label>
      <button id="getImagesButton" type="submit">Get Space Images</button>
    </form>

    <aside class="space-fact">
      <h2>Did You Know?</h2>
      <p id="spaceFact"></p>
    </aside>

    <p id="galleryStatus" role="status">
      Select a date range and click Get Space Images to explore the cosmos.
    </p>
    <section id="gallery" class="gallery" aria-label="NASA search results"></section>
  </main>

  <dialog id="imageModal" aria-labelledby="modalTitle">
    <button id="closeModal" type="button" autofocus>Close</button>
    <h2 id="modalTitle"></h2>
    <p id="modalDate"></p>
    <img id="modalImage" alt="">
    <p id="modalExplanation"></p>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
